# ── Kitty Terminal Config ────────────────────────────────────────────────────
include tokyonight.conf
active_border_color #a6e3a1
window_border_width 1.4pt
confirm_os_window_close 0

# Font settings
font_family      family='CaskaydiaMono Nerd Font' postscript_name=CaskaydiaMonoNF-Regular
bold_font        family='CaskaydiaMono Nerd Font' postscript_name=CaskaydiaMonoNF-SemiBold
italic_font      family='CaskaydiaMono Nerd Font' postscript_name=CaskaydiaMonoNF-Italic
bold_italic_font family='CaskaydiaMono Nerd Font' postscript_name=CaskaydiaMonoNF-SemiBoldItalic
font_size        9.5

# Cursor
cursor_shape     block
cursor_blink_interval 0

# Scrollback
scrollback_lines 1000

# Window settings
window_padding_width 0
window_margin_width 0
background_opacity 0.85

# Tab bar (sleek, minimal, glowing active tab)
tab_bar_edge top
tab_bar_min_tabs 2
tab_bar_style fade
tab_fade 0.25 0.5 0.75 1

# Background of the bar itself
tab_bar_background #1a1b26

# Active tab
active_tab_background   #7aa2f7
active_tab_foreground   #1a1b26
active_tab_font_style   bold

# Inactive tabs
inactive_tab_background #1a1b26
inactive_tab_foreground #c0caf5

# Optional: subtle separator highlight
tab_separator_color #414868

# Copy/paste
clipboard_control write-clipboard write-primary
copy_on_select        clipboard
strip_trailing_spaces smart
paste_actions         quote-urls-at-prompt

# Mouse
mouse_hide_wait 3.0
mouse_map middle release ungrabbed paste_from_selection

# Keyboard shortcuts
map kitty_mod+f5        reload_config_file
map kitty_mod+f2        edit_config_file
#map shift+enter send_text all \x1b[13;2u
# close_window removed — tmux handles pane closing with ctrl+shift+w

# Scrollback — delegate to tmux copy-mode (vi keys)
map kitty_mod+g           launch --type=background tmux copy-mode
map shift+page_up         launch --type=background tmux copy-mode -u
map shift+page_down       launch --type=background tmux send-keys -X cancel
map kitty_mod+return      nop

# Tabs — EXPERIMENT: delegate to tmux windows instead of kitty native tabs.
# Same muscle memory, but windows now persist via resurrect/continuum.
# Revert: restore new_tab/previous_tab/next_tab below.
map kitty_mod+t     launch --type=background tmux new-window -c "#{pane_current_path}"
map kitty_mod+h     launch --type=background tmux previous-window
map kitty_mod+l     launch --type=background tmux next-window
map kitty_mod+alt+t launch --type=background tmux command-prompt -I "#W" "rename-window '%%'"

# Sessions (tmux-backed, managed by ks)
# Sends F12 to tmux, which opens ks in a display-popup
map ctrl+`          send_key f12

# Tmux pane management — kitty sends tmux commands directly
map ctrl+shift+enter         launch --type=background tmux split-window -v -c "#{pane_current_path}"
map ctrl+enter    launch --type=background tmux split-window -h -c "#{pane_current_path}"

map kitty_mod+o     launch --type=background tmux next-layout

map kitty_mod+m     launch --type=background tmux resize-pane -Z

map kitty_mod+f     launch --type=background tmux swap-pane -D
map kitty_mod+b     launch --type=background tmux swap-pane -U

map kitty_mod+w     launch --type=background sh -c "[ $(tmux list-panes | wc -l) -gt 1 ] && tmux kill-pane"
map kitty_mod+q     launch --type=background tmux kill-window

# Animated cursor
cursor_trail 3
cursor_trail_decay 0.1 0.4

# Performance
repaint_delay       7
input_delay         0
sync_to_monitor     yes

# Ligatures and emoji
symbol_map U+1F000-U+1FAFF emoji

# Bell
enable_audio_bell no
visual_bell_duration 0.2
visual_bell_color #f38ba8

# Misc
detect_urls yes
allow_remote_control yes
shell_integration   enabled
listen_on unix:/tmp/mykitty
