# ── Kitty Terminal Config ────────────────────────────────────────────────────
include tokyonight.conf
active_border_color #a6e3a1
window_border_width 1.4pt
confirm_os_window_close 0

# Font settings
font_family      family='CaskaydiaMono Nerd Font' postscript_name=CaskaydiaMonoNF-Regular
bold_font        family='CaskaydiaMono Nerd Font' postscript_name=CaskaydiaMonoNF-SemiBold
italic_font      family='CaskaydiaMono Nerd Font' postscript_name=CaskaydiaMonoNF-Italic
bold_italic_font family='CaskaydiaMono Nerd Font' postscript_name=CaskaydiaMonoNF-SemiBoldItalic
font_size        9.5

# Cursor
cursor_shape     block
cursor_blink_interval 0

# Scrollback
scrollback_lines 1000

# Window settings
window_padding_width 0
window_margin_width 0
background_opacity 0.85

# Tab bar (sleek, minimal, glowing active tab)
tab_bar_edge top
tab_bar_min_tabs 2
tab_bar_style fade
tab_fade 0.25 0.5 0.75 1

# Background of the bar itself
tab_bar_background #1a1b26

# Active tab
active_tab_background   #7aa2f7
active_tab_foreground   #1a1b26
active_tab_font_style   bold

# Inactive tabs
inactive_tab_background #1a1b26
inactive_tab_foreground #c0caf5

# Optional: subtle separator highlight
tab_separator_color #414868

# Copy/paste
clipboard_control write-clipboard write-primary
copy_on_select        clipboard
strip_trailing_spaces smart
paste_actions         quote-urls-at-prompt

# Mouse
mouse_hide_wait 3.0
mouse_map middle release ungrabbed paste_from_selection

# Keyboard shortcuts
map kitty_mod+f5        reload_config_file
map kitty_mod+f2        edit_config_file

# Pass herdr's direct chords through to the terminal (herdr) instead of letting
# kitty handle them. A `map <chord>` with no action unbinds kitty's default so
# the key reaches the running program. (no_op/discard_event would swallow it.)
# NOTE: kitty has no inline comments on map lines -- keep these bare.
# Mirrors [keys] in ~/.dotfiles/herdr/.config/herdr/config.toml:
#   ctrl+shift+t new_tab, ctrl+shift+alt+t rename_tab, ctrl+shift+q close_tab,
#   ctrl+shift+h/l prev/next_tab, ctrl+shift+x close_pane,
#   ctrl+shift+g colored scrollback pager in neovim, ctrl+grave goto,
#   ctrl+shift+w browser split (workspace_picker moved back to prefix+w),
#   ctrl+shift+s split_horizontal, ctrl+shift+d split_vertical,
#   ctrl+shift+m zoom, ctrl+shift+j/k next/previous_agent,
#   ctrl+shift+p/n previous/next_workspace, ctrl+shift+f/b move pane fwd/back,
#   ctrl+shift+o flip split orientation (kitty default: pass_selection_to_program),
#   ctrl+shift+r resize_mode. (Numeric switch_tab/switch_workspace on
#   ctrl+1..9 / ctrl+alt+1..9 aren't kitty defaults, so no unbind needed.)
map ctrl+shift+t
map ctrl+shift+alt+t
map ctrl+shift+q
map ctrl+shift+h
map ctrl+shift+l
map ctrl+shift+x
map ctrl+shift+w
map ctrl+shift+g
map ctrl+grave
map ctrl+shift+s
map ctrl+shift+d
map ctrl+shift+m
map ctrl+shift+j
map ctrl+shift+k
map ctrl+shift+p
map ctrl+shift+n
map ctrl+shift+b
map ctrl+shift+f
map ctrl+shift+o
map ctrl+shift+r

# Animated cursor
cursor_trail 3
cursor_trail_decay 0.1 0.4

# Performance
repaint_delay       7
input_delay         0
sync_to_monitor     yes

# Ligatures and emoji
symbol_map U+1F000-U+1FAFF emoji

# Bell
enable_audio_bell no
visual_bell_duration 0.2
visual_bell_color #f38ba8

# Misc
detect_urls yes
allow_remote_control yes
shell_integration   enabled
listen_on unix:/tmp/mykitty
