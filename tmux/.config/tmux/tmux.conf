# ── tmux config ──────────────────────────────────────────────────────────────
# tmux handles persistence + panes. Kitty handles rendering + tabs.
# Pane management keys (ctrl+shift) are sent by kitty via tmux commands.
# Navigation keys (ctrl+hjkl, alt+hjkl) are handled directly by tmux.

# ── Basics ───────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -g default-shell /bin/zsh
set -g escape-time 0
set -g history-limit 50000
set -g mouse on
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X begin-selection \; send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
set -g focus-events on
set -gs terminal-features ",xterm-kitty:RGB"
set -as terminal-features "xterm-kitty:extkeys"
set -g extended-keys always
set -g allow-passthrough on
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Window naming (basename of cwd instead of "zsh") ─────────────────────────
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# ── SSH environment (persists agent forwarding across reattach) ────────────
set -g update-environment "SSH_AUTH_SOCK SSH_CONNECTION SSH_CLIENT DISPLAY"

# ── Status bar (top, styled to match mini.statusline) ───────────────────────
set -g status on
set -g status-position top
set -g status-interval 1
set -g status-style "bg=#292e42,fg=#a9b1d6"
set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[bg=default] #{?window_zoomed_flag,#[fg=#1a1b26#,bg=#e0af68#,bold] ZOOM #[bg=default] ,}"
set -g status-left-length 40
set -g status-right "#[fg=#a9b1d6,bg=#3b4261] #H #[fg=#1a1b26,bg=#7aa2f7,bold] %H:%M:%S"
set -g status-right-length 50
set -g status-justify left
# EXPERIMENT: windows now visible (tabs moved from kitty -> tmux).
# Revert: set both formats back to "".
setw -g window-status-format "#[fg=#a9b1d6,bg=#3b4261] #I #W "
setw -g window-status-current-format "#[fg=#1a1b26,bg=#a6e3a1,bold] #I #W "
setw -g window-status-separator " "

# ── Pane borders (tokyonight) ────────────────────────────────────────────────
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Message style
set -g message-style "bg=#3b4261,fg=#a9b1d6"
set -g message-command-style "bg=#3b4261,fg=#a9b1d6"

# ── Prefix (fallback) ───────────────────────────────────────────────────────
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix
unbind s
unbind w

# Session picker (ks) in a tmux popup (triggered by kitty ctrl+`)
bind -n F12 display-popup -E -w 80% -h 40% "$HOME/.bin/scripts/ks"

# ── Pane navigation (ctrl+hjkl, unified nvim <-> tmux <-> Hyprland) ───────────
# In neovim: pass through (smart-splits handles nvim<->tmux). Otherwise: move
# toward the edge, or — if already at that pane edge — escalate to the Hyprland
# window in that direction via the shared focus helper.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "if -F '#{pane_at_left}'   'run-shell \"$HOME/.config/hypr/scripts/focus l\"' 'select-pane -L'"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "if -F '#{pane_at_bottom}' 'run-shell \"$HOME/.config/hypr/scripts/focus d\"' 'select-pane -D'"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "if -F '#{pane_at_top}'    'run-shell \"$HOME/.config/hypr/scripts/focus u\"' 'select-pane -U'"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "if -F '#{pane_at_right}'  'run-shell \"$HOME/.config/hypr/scripts/focus r\"' 'select-pane -R'"

# ── Pane resizing (alt+hjkl, shared with neovim via smart-splits) ────────────
bind -n M-h if-shell "$is_vim" "send-keys M-h" "resize-pane -L 3"
bind -n M-j if-shell "$is_vim" "send-keys M-j" "resize-pane -D 3"
bind -n M-k if-shell "$is_vim" "send-keys M-k" "resize-pane -U 3"
bind -n M-l if-shell "$is_vim" "send-keys M-l" "resize-pane -R 3"

# ── Don't destroy session when last window closes ───────────────────────────
set -g detach-on-destroy on
set -g remain-on-exit off

# ── Plugins ──────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect: save/restore sessions across reboots
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'nvim vim ssh sshfs'
set -g @resurrect-strategy-nvim 'session'

# Continuum: auto-save every 2 minutes, auto-restore on tmux start
set -g @continuum-save-interval '2'
set -g @continuum-restore 'on'

# Initialize TPM (keep at bottom)
run '~/.config/tmux/plugins/tpm/tpm'
