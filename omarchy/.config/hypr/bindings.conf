# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
$terminal = uwsm-app -- kitty
$browser = uwsm-app -- chromium --new-window --ozone-platform=wayland

# Hyprland keys
bind = SUPER_SHIFT, F5, exec, hyprctl reload && notify-send "󰣇  Hyprland" "Config reloaded ✅"

# Unbind omarchy defaults
unbind = SUPER, O
unbind = SUPER, ENTER
unbind = SUPER, H
unbind = SUPER, J
unbind = SUPER, K
unbind = SUPER, L
unbind = SUPER, W
unbind = SUPER, UP
unbind = SUPER, BACKSLASH
unbind = SUPER, LEFT
unbind = SUPER, DOWN
unbind = SUPER, RIGHT
unbind = SUPER SHIFT, code:10
unbind = SUPER SHIFT, code:11
unbind = SUPER SHIFT, code:12
unbind = SUPER SHIFT, code:13
unbind = SUPER SHIFT, code:14
unbind = SUPER SHIFT, code:15
unbind = SUPER SHIFT, code:16
unbind = SUPER SHIFT, code:17
unbind = SUPER SHIFT, code:18
unbind = SUPER SHIFT, code:19
unbind = SUPER, code:20
unbind = SUPER, code:21
unbind = SUPER SHIFT, code:20
unbind = SUPER SHIFT, code:21
unbind = SUPER, BACKSLASH
unbind = SUPER, slash

# App shortcuts
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com/"
bindd = SUPER SHIFT, B, Bluesky, exec, omarchy-launch-webapp "https://bsky.app/"
bindd = SUPER SHIFT, C, Calculator, exec, uwsm-app -- gnome-calculator
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://mail.google.com/"
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, G, GitHub, exec, omarchy-launch-webapp "https://github.com/"
bindd = SUPER SHIFT, M, Messages, exec, omarchy-launch-webapp "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, N, Editor, exec, kitty zsh -lc "$(which nvim)"
bindd = SUPER SHIFT, R, Reddit, exec, omarchy-launch-webapp "https://reddit.com/"
bindd = SUPER SHIFT, S, Spotify, exec, uwsm-app -- spotify
bindd = SUPER SHIFT, T, System monitor, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT, W, Web Browser, exec, $browser
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"

# View keybindings
bindd = SUPER, slash, Apps, exec, omarchy-menu-keybindings

# Close focused window
bind = SUPER, Q, killactive
bind = SUPER ALT, Q, forcekillactive

# Terminal
bindd = SUPER, return, Terminal, exec, $terminal
bindd = SUPER SHIFT, return, Terminal, exec, $terminal -e ks attach home

# Lock screen
bind = CTRL_ALT, L, exec, uwsm app -- hyprlock

# Vim-style movement between windows
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r

# Vim-style move windows
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, J, movewindow, d
bind = SUPER SHIFT, K, movewindow, u
bind = SUPER SHIFT, L, movewindow, r

# Resize submap
bind = SUPER, R, submap, resize

# Resize submap
submap = resize

# Use binde for repeat
# Use bindr for release 
# Use bindo for long press
binde = , h, resizeactive, -25 0
binde = , l, resizeactive,  25 0
binde = , k, resizeactive,  0 -25
binde = , j, resizeactive,  0  25

# Exit resize mode
bind = , escape, submap, reset
bind = , return, submap, reset
bind = SUPER, R, submap, reset

submap = reset

# or hold -/+
binde = SUPER, code:20, resizeactive, -25 0
binde = SUPER, code:21, resizeactive, 25 0
binde = SUPER SHIFT, code:20, resizeactive, 0 -25
binde = SUPER SHIFT, code:21, resizeactive, 0 25

# Move focused window to workspace N
bindd = SUPER SHIFT, code:10, Move window silently to workspace 1, movetoworkspacesilent, 1
bindd = SUPER SHIFT, code:11, Move window silently to workspace 2, movetoworkspacesilent, 2
bindd = SUPER SHIFT, code:12, Move window silently to workspace 3, movetoworkspacesilent, 3
bindd = SUPER SHIFT, code:13, Move window silently to workspace 4, movetoworkspacesilent, 4
bindd = SUPER SHIFT, code:14, Move window silently to workspace 5, movetoworkspacesilent, 5
bindd = SUPER SHIFT, code:15, Move window silently to workspace 6, movetoworkspacesilent, 6
bindd = SUPER SHIFT, code:16, Move window silently to workspace 7, movetoworkspacesilent, 7
bindd = SUPER SHIFT, code:17, Move window silently to workspace 8, movetoworkspacesilent, 8
bindd = SUPER SHIFT, code:18, Move window silently to workspace 9, movetoworkspacesilent, 9
bindd = SUPER SHIFT, code:19, Move window silently to workspace 10, movetoworkspacesilent, 10

# Toggle split orientation
bind = SUPER, semicolon, layoutmsg, togglesplit

# Toggle layout (dwindle <-> master)
bind = SUPER, O, exec, sh -c 'layout=$(hyprctl getoption general:layout -j | jq -r .str); if [ "$layout" = "dwindle" ]; then hyprctl keyword general:layout master; else hyprctl keyword general:layout dwindle; fi'

# Maximize/zoom window in split view (toggle)
bind = SUPER, M, fullscreen, 1

# Group tabs
bindd = SUPER, bracketleft, Previous group tab, changegroupactive, b
bindd = SUPER, bracketright, Previous group tab, changegroupactive, f
bindd = SUPER, D, Move out of group, moveoutofgroup
bindd = SUPER CTRL, H, Group left, moveintogroup, l
bindd = SUPER CTRL, L, Group right, moveintogroup, r
bindd = SUPER CTRL, K, Group up, moveintogroup, u
bindd = SUPER CTRL, J, Group down, moveintogroup, d
