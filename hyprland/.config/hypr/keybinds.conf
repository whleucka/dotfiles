# Keybindings
# Super (Windows key) as main modifier

$mod = SUPER
$env = env EDITOR=nvim VISUAL=nvim
$terminal = $env kitty
$browser = chromium
$filemanager = thunar
$menu = fuzzel

# -----------------------------------------------------------------------------
# Help
# -----------------------------------------------------------------------------

bindd = $mod, slash, Show keybinds, exec, /home/whleucka/.bin/scripts/keybinds

# -----------------------------------------------------------------------------
# Applications
# -----------------------------------------------------------------------------

bindd = $mod, Return, Terminal, exec, $terminal
bindd = $mod SHIFT, Return, Terminal, exec, $terminal ks attach home
bindd = $mod, Space, App launcher, exec, $menu
bindd = $mod SHIFT, I, Banking, exec, $browser --app=https://cibc.com
bindd = $mod SHIFT, B, Bluesky, exec, $browser --app=https://bsky.app
bindd = $mod SHIFT, C, Calculator, exec, gnome-calculator
bindd = $mod SHIFT, D, Lazydocker, exec, $terminal lazydocker
bindd = $mod SHIFT, E, Email, exec, $browser --app=https://mail.google.com
bindd = $mod SHIFT, F, File manager, exec, $filemanager
bindd = $mod SHIFT, G, GitHub, exec, $browser --app=https://github.com
bindd = $mod SHIFT, N, Messages, exec, $terminal nvim
bindd = $mod SHIFT, M, Messages, exec, $browser --app=https://messages.google.com/web/conversations
bindd = $mod SHIFT, R, Reddit, exec, $browser --app=https://reddit.com
bindd = $mod SHIFT, S, Spotify, exec, spotify
bindd = $mod SHIFT, T, System monitor (btop), exec, $terminal btop
bindd = $mod SHIFT, U, Update system, exec, [float; size 900 600; center] $terminal -e yay -Syu | -y
bindd = $mod SHIFT, W, Browser, exec, $browser
bindd = $mod SHIFT, Y, YouTube, exec, $browser --app=https://youtube.com

# -----------------------------------------------------------------------------
# Window Management
# -----------------------------------------------------------------------------

bindd = $mod, Q, Close window, killactive
bindd = $mod SHIFT, Q, Exit Hyprland, exit
bindd = $mod, F, Fullscreen, fullscreen, 0
bindd = $mod, M, Maximize, fullscreen, 1
bindd = $mod, T, Toggle floating, togglefloating
bindd = $mod, SEMICOLON, Toggle split, layoutmsg, togglesplit
bindd = $mod, O, Toggle layout (dwindle/monocle), exec, hyprctl keyword general:layout $([ "$(hyprctl getoption general:layout -j | jq -r '.str')" = "dwindle" ] && echo "monocle" || echo "dwindle")

# Focus (vim keys)
bindd = $mod, H, Focus left, movefocus, l
bindd = $mod, L, Focus right, movefocus, r
bindd = $mod, K, Focus up, movefocus, u
bindd = $mod, J, Focus down, movefocus, d
bindd = $mod, H, Previous window (monocle), layoutmsg, cycleprev
bindd = $mod, L, Next window (monocle), layoutmsg, cyclenext

# Move windows (vim keys)
bindd = $mod SHIFT, H, Move window left, movewindow, l
bindd = $mod SHIFT, L, Move window right, movewindow, r
bindd = $mod SHIFT, K, Move window up, movewindow, u
bindd = $mod SHIFT, J, Move window down, movewindow, d

# Resize hold -/+
binde = SUPER, code:20, resizeactive, -25 0
binde = SUPER, code:21, resizeactive, 25 0
binde = SUPER SHIFT, code:20, resizeactive, 0 -25
binde = SUPER SHIFT, code:21, resizeactive, 0 25

# Resize submap
bindd = $mod, R, Resize mode, submap, resize
submap = resize

binde = , H, resizeactive, -25 0
binde = , L, resizeactive,  25 0
binde = , K, resizeactive,  0 -25
binde = , J, resizeactive,  0  25

bind = , Escape, submap, reset
submap = reset

# -----------------------------------------------------------------------------
# Workspaces
# -----------------------------------------------------------------------------

bindd = $mod, 1, Workspace 1, workspace, 1
bindd = $mod, 2, Workspace 2, workspace, 2
bindd = $mod, 3, Workspace 3, workspace, 3
bindd = $mod, 4, Workspace 4, workspace, 4
bindd = $mod, 5, Workspace 5, workspace, 5
bindd = $mod, 4, Workspace 4, workspace, 4
bindd = $mod, 5, Workspace 5, workspace, 5
bindd = $mod, 6, Workspace 6, workspace, 6
bindd = $mod, 7, Workspace 7, workspace, 7
bindd = $mod, 8, Workspace 8, workspace, 8
bindd = $mod, 9, Workspace 9, workspace, 9
bindd = $mod, 0, Workspace 10, workspace, 10

# Move focused window to workspace N
bindd = SUPER SHIFT, 1, Move window to workspace 1, movetoworkspacesilent, 1
bindd = SUPER SHIFT, 2, Move window to workspace 2, movetoworkspacesilent, 2
bindd = SUPER SHIFT, 3, Move window to workspace 3, movetoworkspacesilent, 3
bindd = SUPER SHIFT, 4, Move window to workspace 4, movetoworkspacesilent, 4
bindd = SUPER SHIFT, 5, Move window to workspace 5, movetoworkspacesilent, 5
bindd = SUPER SHIFT, 6, Move window to workspace 6, movetoworkspacesilent, 6
bindd = SUPER SHIFT, 7, Move window to workspace 7, movetoworkspacesilent, 7
bindd = SUPER SHIFT, 8, Move window to workspace 8, movetoworkspacesilent, 8
bindd = SUPER SHIFT, 9, Move window to workspace 9, movetoworkspacesilent, 9
bindd = SUPER SHIFT, 0, Move window to workspace 10, movetoworkspacesilent, 10

# Special workspace (scratchpad)
bindd = $mod SHIFT, Home, Toggle scratchpad, togglespecialworkspace, magic
bindd = $mod SHIFT, Insert, Move to scratchpad, movetoworkspace, special:magic
bindd = $mod SHIFT, Delete, Remove from scratchpad, movetoworkspace, e+0

# -----------------------------------------------------------------------------
# Grouped Windows (Tabs)
# -----------------------------------------------------------------------------

bindd = $mod, G, Toggle group, togglegroup
bindd = $mod, D, Move out of group, moveoutofgroup
bindd = SUPER, bracketleft, Previous group tab, changegroupactive, b
bindd = SUPER, bracketright, Next group tab, changegroupactive, f
bindd = $mod CTRL, H, Group left, moveintogroup, l
bindd = $mod CTRL, L, Group right, moveintogroup, r
bindd = $mod CTRL, K, Group up, moveintogroup, u
bindd = $mod CTRL, J, Group down, moveintogroup, d
bindd = $mod ALT, G, Lock group, lockactivegroup, toggle

# -----------------------------------------------------------------------------
# Mouse bindings
# -----------------------------------------------------------------------------

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# -----------------------------------------------------------------------------
# Clipboard ks attach home
# -----------------------------------------------------------------------------

bindd = $mod, V, Clipboard history, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bindd = $mod, C, Color picker, exec, hyprpicker -r

# -----------------------------------------------------------------------------
# Screenshots
# -----------------------------------------------------------------------------

bindd = , Print, Screenshot region, exec, /home/whleucka/.bin/scripts/screenshot-region
bindd = $mod, Print, Screenshot full, exec, /home/whleucka/.bin/scripts/screenshot

# -----------------------------------------------------------------------------
# Screen recording
# -----------------------------------------------------------------------------

bindd = $mod ALT, R, Record selected region, exec, sh -c 'wl-screenrec -g "$(slurp)" -f $HOME/Videos/recording_$(date +%Y%m%d_%H%M%S).mp4'
bindd = $mod CTRL, R, Stop recording, exec, killall -s SIGINT wl-screenrec

# -----------------------------------------------------------------------------
# Media / Hardware keys
# -----------------------------------------------------------------------------

# Volume
binde = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
binde = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bind  = , XF86AudioMicMute,     exec, swayosd-client --input-volume mute-toggle

# Brightness
binde = , XF86MonBrightnessUp,   exec, swayosd-client --brightness raise
binde = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Media
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioStop, exec, playerctl stop

# -----------------------------------------------------------------------------
# Lock
# -----------------------------------------------------------------------------

bindd = CTRL ALT, L, Lock screen, exec, hyprlock

# -----------------------------------------------------------------------------
# Notifications
# -----------------------------------------------------------------------------

bindd = $mod, period, Restore notification, exec, makoctl restore
bindd = $mod, comma, Dismiss notification, exec, makoctl dismiss
bindd = $mod SHIFT, comma, Dismiss all notifications, exec, makoctl dismiss --all
