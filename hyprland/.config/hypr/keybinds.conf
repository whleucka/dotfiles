# Keybindings
# Super (Windows key) as main modifier

$mod = SUPER
$terminal = kitty
$browser = chromium
$filemanager = thunar
$menu = fuzzel

# -----------------------------------------------------------------------------
# Applications
# -----------------------------------------------------------------------------

bind = $mod, Return, exec, $terminal
bind = $mod, Space, exec, $menu
bind = $mod SHIFT, B, exec, $browser --app=https://bsky.com
bind = $mod SHIFT, C, exec, gnome-calculator
bind = $mod SHIFT, E, exec, $browser --app=https://mail.google.com
bind = $mod SHIFT, F, exec, $terminal yazi
bind = $mod SHIFT, G, exec, $browser --app=https://github.com
bind = $mod SHIFT, M, exec, $browser --app=https://cibc.com
bind = $mod SHIFT, R, exec, $browser --app=https://reddit.com
bind = $mod SHIFT, S, exec, $browser --app=https://open.spotify.com
bind = $mod SHIFT, T, exec, $terminal btop
bind = $mod SHIFT, W, exec, $browser
bind = $mod SHIFT, Y, exec, $browser --app=https://youtube.com

# -----------------------------------------------------------------------------
# Window Management
# -----------------------------------------------------------------------------

bind = $mod, Q, killactive
bind = $mod SHIFT, Q, exit
bind = $mod, F, fullscreen, 0
bind = $mod, M, fullscreen, 1
bind = $mod, P, pseudo
bind = $mod, T, togglefloating
bind = $mod, O, togglesplit

# Focus (vim keys)
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Move windows (vim keys)
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# Resize hold -/+
binde = SUPER, code:20, resizeactive, -25 0
binde = SUPER, code:21, resizeactive, 25 0
binde = SUPER SHIFT, code:20, resizeactive, 0 -25
binde = SUPER SHIFT, code:21, resizeactive, 0 25

# Resize submap
bind = $mod, R, submap, resize
submap = resize

binde = , H, resizeactive, -25 0
binde = , L, resizeactive,  25 0
binde = , K, resizeactive,  0 -25
binde = , J, resizeactive,  0  25

bind = , Escape, submap, reset
submap = reset

# -----------------------------------------------------------------------------
# Workspaces
# -----------------------------------------------------------------------------

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move focused window to workspace N
bindd = SUPER SHIFT, 1, Move window silently to workspace 1, movetoworkspacesilent, 1
bindd = SUPER SHIFT, 2, Move window silently to workspace 2, movetoworkspacesilent, 2
bindd = SUPER SHIFT, 3, Move window silently to workspace 3, movetoworkspacesilent, 3
bindd = SUPER SHIFT, 4, Move window silently to workspace 4, movetoworkspacesilent, 4
bindd = SUPER SHIFT, 5, Move window silently to workspace 5, movetoworkspacesilent, 5
bindd = SUPER SHIFT, 6, Move window silently to workspace 6, movetoworkspacesilent, 6
bindd = SUPER SHIFT, 7, Move window silently to workspace 7, movetoworkspacesilent, 7
bindd = SUPER SHIFT, 8, Move window silently to workspace 8, movetoworkspacesilent, 8
bindd = SUPER SHIFT, 9, Move window silently to workspace 9, movetoworkspacesilent, 9
bindd = SUPER SHIFT, 0, Move window silently to workspace 10, movetoworkspacesilent, 10

# Special workspace (scratchpad)
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# -----------------------------------------------------------------------------
# Mouse bindings
# -----------------------------------------------------------------------------

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# -----------------------------------------------------------------------------
# Screenshots
# -----------------------------------------------------------------------------

# Full screen
bind = , Print, exec, grim ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
# Region select
bind = $mod, Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
# Region to clipboard
bind = $mod SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy

# -----------------------------------------------------------------------------
# Media / Hardware keys
# -----------------------------------------------------------------------------

# Volume
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
binde = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioStop, exec, playerctl stop

# -----------------------------------------------------------------------------
# Lock
# -----------------------------------------------------------------------------

bind = CTRL ALT, L, exec, hyprlock

# -----------------------------------------------------------------------------
# Notifications
# -----------------------------------------------------------------------------

bind = $mod, period, exec, makoctl restore
bind = $mod, comma, exec, makoctl dismiss
bind = $mod SHIFT, comma, exec, makoctl dismiss --all
