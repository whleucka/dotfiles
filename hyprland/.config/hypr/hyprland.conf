# Hashiru Hyprland Configuration (0.53.1+)
# https://wiki.hypr.land/

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf

# -----------------------------------------------------------------------------
# Environment
# -----------------------------------------------------------------------------

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    col.active_border = rgba(7aa2f7ee) rgba(9ece6aee) 45deg
    col.inactive_border = rgba(414868aa)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

# -----------------------------------------------------------------------------
# Input
# -----------------------------------------------------------------------------

input {
    kb_layout = us
    kb_options = caps:escape

    repeat_rate = 80
    repeat_delay = 200

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
        disable_while_typing = true
    }
}

gestures {
    gesture = 3, horizontal, workspace
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.5
}

# -----------------------------------------------------------------------------
# Appearance
# -----------------------------------------------------------------------------

decoration {
    rounding = 2

    blur {
        enabled = true
        size = 3
        passes = 2
        noise = 0.0117
        brightness = 0.8
        contrast = 1
    }
}

animations {
    enabled = true

    # macOS-style beziers
    bezier = easeOutExpo, 0.16, 1, 0.3, 1        # fast start, smooth deceleration (macOS signature feel)
    bezier = easeOutQuart, 0.25, 1, 0.5, 1        # gentler ease-out for fades/close
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1     # balanced for workspace slides

    # Window open/close/move
    animation = windowsIn,  1, 4, easeOutExpo,   popin 85%
    animation = windowsOut, 1, 3, easeOutQuart,  popin 85%
    animation = windowsMove, 1, 4, easeOutExpo

    # Workspace transitions
    animation = workspaces, 1, 4, easeInOutCubic, slide

    # Fade for popups, tooltips, etc.
    animation = fade, 1, 3, easeOutQuart

    # Layers (waybar, rofi, notifications)
    animation = layers,    1, 3, easeOutExpo,   slide
    animation = layersOut, 1, 2, easeOutQuart,  fade
}

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    smart_resizing = true
    force_split = 2
}

master {
    new_status = master
}

# -----------------------------------------------------------------------------
# Grouped Windows (Tabs)
# -----------------------------------------------------------------------------

group {
    col.border_active = rgba(4a7fcfee)
    col.border_inactive = rgba(0d1f3caa)

    groupbar {
        enabled = true
        font_size = 12
        font_family = monospace
        font_weight_active = ultraheavy
        font_weight_inactive = normal

        indicator_height = 0
        indicator_gap = 5
        height = 22
        gaps_in = 5
        gaps_out = 0

        text_color = rgb(c0caf5)
        text_color_inactive = rgba(c0caf570)
        col.active = rgba(00000090)
        col.inactive = rgba(00000090)

        gradients = true
        gradient_rounding = 0
        gradient_round_only_edges = false
    }
}

# -----------------------------------------------------------------------------
# Misc
# -----------------------------------------------------------------------------

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vfr = true
    # 0.53+ replaces new_window_takes_over_fullscreen
    on_focus_under_fullscreen = 1
}

xwayland {
    force_zero_scaling = true
}
