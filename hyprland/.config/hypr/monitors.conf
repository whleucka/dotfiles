# Monitor Configuration
# https://wiki.hypr.land/Configuring/Monitors/

# Default: auto-detect and use preferred resolution
monitor = , preferred, auto, 1

# -----------------------------------------------------------------------------
# ThinkPad T14s / P43s (14" 1920x1080)
# -----------------------------------------------------------------------------
# monitor = eDP-1, 1920x1080@60, 0x0, 1

# -----------------------------------------------------------------------------
# External monitor examples
# -----------------------------------------------------------------------------
# 27" 4K on the right
# monitor = DP-1, 3840x2160@60, 1920x0, 1.5

# 27" 1440p on the right
# monitor = HDMI-A-1, 2560x1440@144, 1920x0, 1

# Mirror laptop display
# monitor = HDMI-A-1, 1920x1080@60, 0x0, 1, mirror, eDP-1
