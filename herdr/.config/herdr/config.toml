# herdr configuration — stow-managed via ~/.dotfiles/herdr
# Docs: https://herdr.dev/docs/config-reference/
# Print all defaults:  herdr --default-config
# Validate this file:  herdr config check
# Reload live server:  herdr server reload-config   (or prefix+shift+r)

# We've been through onboarding; don't show it again.
onboarding = false

[theme]
# Matches the kitty Tokyo Night theme in ~/.dotfiles/kitty.
name = "tokyo-night"

[terminal]
# Interactive panes use zsh (our login shell).
default_shell = "zsh"

[keys]
# Prefix: ctrl+a (screen-style). Tap it, release, then the action key.
prefix = "ctrl+a"

# Tabs
new_tab = "prefix+t"           # (default was prefix+c)
rename_tab = "prefix+shift+t"  # herdr default
previous_tab = "prefix+["      # tab nav prev (default was prefix+p)
next_tab = "prefix+]"          # tab nav next (default was prefix+n)

# Panes
close_pane = "prefix+w"        # close pane (moved off prefix+x)
# Pane focus stays on the default prefix+h/j/k/l (left/down/up/right).

# Session
detach = "prefix+shift+q"      # detach (default was prefix+q, now close_workspace)

# Workspaces
workspace_picker = "prefix+a"      # ws fuzzy picker
close_workspace = "prefix+q"       # close workspace (default was prefix+shift+d)
new_workspace = "prefix+shift+n"   # herdr default (shift+n pairs with next_workspace on prefix+n)
rename_workspace = "prefix+shift+w"  # herdr default
previous_workspace = "prefix+p"    # ws nav prev (default unset; took over old previous_tab key)
next_workspace = "prefix+n"        # ws nav next (default unset; took over old next_tab key)
goto = "prefix+g"              # quick jump  (herdr default)

# Agents
open_notification_target = "prefix+o"  # herdr default

# Unified super+hjkl navigation (nvim splits -> herdr panes -> Hyprland windows).
# Hyprland's super+hjkl injects ctrl+alt+hjkl into this pty (see ~/.config/hypr/
# scripts/nav); the router decides forward-to-nvim vs move-pane vs escalate.
[[keys.command]]
key = "ctrl+alt+h"
type = "shell"
command = "$HOME/.config/hypr/scripts/herdr-nav key h l"

[[keys.command]]
key = "ctrl+alt+j"
type = "shell"
command = "$HOME/.config/hypr/scripts/herdr-nav key j d"

[[keys.command]]
key = "ctrl+alt+k"
type = "shell"
command = "$HOME/.config/hypr/scripts/herdr-nav key k u"

[[keys.command]]
key = "ctrl+alt+l"
type = "shell"
command = "$HOME/.config/hypr/scripts/herdr-nav key l r"

[ui]
# Draw borders + gaps around split panes so focus is obvious.
pane_borders = true
pane_gaps = true

[ui.toast]
# Route agent state-change notifications to the OS service (mako).
# Set to "off" if these get noisy, "herdr" for in-app toasts only.
delivery = "system"

[ui.sound]
# Audible ping when a background agent changes state.
# Custom mp3s (relative to this config's dir). Swap the two to taste.
enabled = true
request_path = "mgs.mp3"   # agent needs attention (MGS "!" alert)
done_path = "ding.mp3"     # agent finished

[session]
# Restore AI-agent panes into their sessions after a server restart.
resume_agents_on_restore = true
